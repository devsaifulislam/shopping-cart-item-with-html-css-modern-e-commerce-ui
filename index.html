<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Shopping Cart Item with HTML &amp; CSS 🛒 | Modern E-commerce UI</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
<div class="cart-item">
  <div class="product-image">
    <img
      src="https://images.unsplash.com/photo-1542291026-7eec264c27ff?auto=format&fit=crop&w=500&q=85"
      alt="Red running shoes"
    >
  </div>

  <div class="product-info">
    <div class="product-heading">
      <div>
        <p class="product-category">RUNNING SHOES</p>
        <h1>Air Motion Runner</h1>
      </div>

      <button class="remove-button" type="button" aria-label="Remove item">
        ×
      </button>
    </div>

    <p class="product-variant">Red · Size 42</p>

    <div class="item-footer">
      <div class="quantity-control">
        <button type="button" aria-label="Decrease quantity">−</button>
        <span>1</span>
        <button type="button" aria-label="Increase quantity">+</button>
      </div>

      <div class="item-price">
        <strong>$89.00</strong>
        <del>$119.00</del>
      </div>
    </div>
  </div>
</div>
</body>
</html>
